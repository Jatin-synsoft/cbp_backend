<div style="
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #333333;
    line-height: 1.6;
    font-size: 15px;
">

    <h2 style="color:#007b83; margin-top: 0;">
        🎉 New User Registered
    </h2>

    <p>Hello Admin,</p>

    <p>
        A new <strong style="color:#007b83;">{{role}}</strong>
        has just registered on the <span style="font-weight: 600;">Consultant Booking Platform</span>.
    </p>

    <p><strong style="color:#007b83;">Name:</strong> {{fullName}}</p>
    <p><strong style="color:#007b83;">Email:</strong> {{email}}</p>
    <p><strong style="color:#007b83;">Phone:</strong> {{phone}}</p>

    <a href="{{url}}" style="
           display:inline-block;
           background-color:#007b83;
           color:#ffffff !important;
           text-decoration:none;
           padding:10px 20px;
           margin-top:20px;
           border-radius:6px;
           font-weight:500;
       ">
        View in Dashboard
    </a>

    <p style="margin-top: 20px;">
        Thank you,<br />
        <span style="font-weight: 600;">The Consultant Booking Platform Team</span>
    </p>
</div>
