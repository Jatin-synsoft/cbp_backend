<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{subject}}</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            background-color: #F8F8F8;
            margin: 40px auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0f1824, #1d2735);
            padding: 16px;
            text-align: center;
            position: relative;
        }

        .header img {
            width: 220px;
            margin-top: 4px;
        }

        .yellow-line {
            width: 100%;
            height: 4px;
            background-color: #f4c430;
        }

        .content {
            padding: 30px 35px;
            color: #333333;
            line-height: 1.7;
            font-size: 14px;
        }

        .content p {
            margin-bottom: 10px !important;
            margin-top: 0;
        }

        .btn {
            display: inline-block;
            background-color: #1b75bc;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 26px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            margin: 12px 0;
        }

        .footer {
            background-color: #f9f9f9;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #777777;
            border-top: 1px solid #e5e5e5;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="https://boardtide.lon1.digitaloceanspaces.com/image/1764938894534.png" alt="Boardtide Logo" />
        </div>
        <div class="yellow-line"></div>

        <!-- Dynamic Content Injected Here -->
        <div class="content">
            {{content}}
        </div>

        <!-- Footer -->
        <div class="footer">
            © {{year}} Boardtide. All rights reserved.
        </div>
    </div>
</body>

</html>
